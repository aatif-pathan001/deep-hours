<text x="40" y="100" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#18263b">REAL HARDWARE: classic 5 V Nano + two common-cathode single-digit displays</text>
<text x="40" y="138" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#18263b">Read each numbered section. Segment names are NOT physical leg numbers.</text>
